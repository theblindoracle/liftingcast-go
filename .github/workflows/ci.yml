name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  # Tags the next version when the pushed commit is a PR merged with a
  # release:minor or release:patch label. Runs only once check passes on main.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the current version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"

          tagged="$(git tag --points-at "$sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -n "$tagged" ]; then
            echo "$sha is already tagged $tagged; nothing to release."
            exit 0
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
            --jq "map(select(.merged_at != null and .merge_commit_sha == \"$sha\")) | first | .number // empty")"
          if [ -z "$pr" ]; then
            echo "$sha is not a merged PR; nothing to release."
            exit 0
          fi

          mapfile -t labels < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.labels[].name')
          echo "PR #$pr labels: ${labels[*]:-(none)}"

          version="$(git tag -l | go run ./internal/nextversion "${labels[@]}")"
          if [ -z "$version" ]; then
            echo "PR #$pr has no release label; nothing to release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version" "$sha"
          git push origin "refs/tags/$version"
          echo "Tagged $sha as $version (PR #$pr)."
